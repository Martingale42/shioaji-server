[project]
name = "shioaji-server"
version = "0.1.0"
description = "REST/WebSocket gateway for Shioaji trading SDK"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "shioaji[speed]",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[project.scripts]
shioaji-server = "shioaji_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
