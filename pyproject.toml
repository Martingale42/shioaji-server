[project]
name = "shioaji-server"
version = "0.1.0"
description = "REST/WebSocket gateway for Shioaji trading SDK"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "shioaji[speed]",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "polars>=1.0.0",
    "nautilus-trader",
]

[tool.uv.sources]
nautilus-trader = [
    { url = "https://github.com/Martingale42/nautilus_trader/releases/download/v1.226.2-sinopac/nautilus_trader-1.226.2-cp313-cp313-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux'" },
    { url = "https://github.com/Martingale42/nautilus_trader/releases/download/v1.226.2-sinopac/nautilus_trader-1.226.2-cp313-cp313-macosx_15_0_arm64.whl", marker = "sys_platform == 'darwin'" },
    { url = "https://github.com/Martingale42/nautilus_trader/releases/download/v1.226.2-sinopac/nautilus_trader-1.226.2-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
shioaji-server = "shioaji_server.__main__:main"
shioaji-data = "shioaji_server.data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests can import the `scripts` package (not installed).
pythonpath = ["."]
markers = [
    "gateway: live-gate acceptance tests against a running simulation gateway (require SINOPAC_GATEWAY_URL)",
]
